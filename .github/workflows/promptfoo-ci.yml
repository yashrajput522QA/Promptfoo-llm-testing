name: Promptfoo Evaluation

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  evaluate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run Promptfoo evaluations
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PROMPTFOO_DISABLE_UPDATE: 1
          PROMPTFOO_DISABLE_TELEMETRY: 1
        run: |
          echo "Running 01-basic-llm-assertion.yaml"
          npx promptfoo eval -c evaluations/01-basic-llm-assertion.yaml
          
          echo "Running 02-multiple-assertions.yaml"
          npx promptfoo eval -c evaluations/02-multiple-assertions.yaml
          
          echo "Running 06-hallucination.yaml"
          npx promptfoo eval -c evaluations/06-hallucination.yaml
          
          echo "Running 07-prompt-injection.yaml"
          npx promptfoo eval -c evaluations/07-prompt-injection.yaml
          
          echo "Running 08-jailbreak.yaml"
          npx promptfoo eval -c evaluations/08-jailbreak.yaml
          
          echo "Running 09-csv-inputs.yaml"
          npx promptfoo eval -c evaluations/09-csv-inputs.yaml
          
          echo "Running 10-tool-calling.yaml"
          npx promptfoo eval -c evaluations/10-tool-calling.yaml
