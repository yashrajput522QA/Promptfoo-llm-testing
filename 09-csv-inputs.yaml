# =============================================================
# 09. CSV INPUTS EXAMPLE
# =============================================================
# This test doesn't hardcode variables. Instead, it reads 
# the `query` and `expected` variables directly from queries.csv
#
# Run:  npx promptfoo eval -c 09-csv-inputs.yaml
# =============================================================

description: "run test and quaries that are fetch from a CSV file"

providers:
  - id: groq:llama-3.3-70b-versatile
    config:
      temperature: 0

prompts:
  - |
    You are a helpful assistant. Answer the user's question accurately and concisely.

    ### Question:
    {{query}}

defaultTest:
  options:
    provider: groq:llama-3.3-70b-versatile
  assert:
    # This assertion dynamically checks if the output contains 
    # whatever is in the 'expected' column of the CSV row
    - type: icontains
      value: "{{expected}}"

#  point it to your CSV file
tests: file://queries.csv
