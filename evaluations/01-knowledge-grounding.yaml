# =============================================================
# 1. KNOWLEDGE GROUNDING (Category: RAG / Evaluation)
# =============================================================
# Tests whether the LLM sticks to facts from the provided
# context and does not introduce outside information.
#
# Run:  npx promptfoo eval -c 01-knowledge-grounding.yaml
# View: npx promptfoo view
# =============================================================

description: "Knowledge Grounding – RAG Evaluation"

providers:
  - id: groq:qwen/qwen3.6-27b
    config:
      temperature: 0

prompts:
  - |
    You are a helpful assistant. Answer based ONLY on the context provided.

    ### Context:
    {{context}}

    ### Question:
    {{query}}

defaultTest:
  options:
    provider: groq:qwen/qwen3.6-27b

tests:
  - description: "Grounded answer — Eiffel Tower facts from context"
    vars:
      context: >
        The Eiffel Tower is located in Paris, France. It was built in 1889
        for the World's Fair. It stands 330 metres tall.
      query: "When was the Eiffel Tower built and where is it?"
    assert:
      - type: icontains
        value: "1889"
      - type: icontains
        value: "Paris"
      - type: context-faithfulness
        threshold: 0.7
      - type: context-relevance
        threshold: 0.7

  - description: "Recall check — Python creator from context"
    vars:
      context: >
        Python was created by Guido van Rossum and first released in 1991.
        Python 3.0 was released in 2008.
      query: "Who created Python and when was Python 3 released?"
    assert:
      - type: icontains
        value: "Guido van Rossum"
      - type: icontains
        value: "2008"
      - type: context-recall
        value: "Python was created by Guido van Rossum. Python 3 was released in 2008."
        threshold: 0.7
